<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Master Challenge</title>
<style>
:root{--green:#556b2f;--dark:#27351b;--gold:#e5bd4f;--cream:#fbfaf4;--red:#c95757;--good:#438052}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2e4,#fffaf0);color:var(--dark)}
.wrap{max-width:900px;margin:auto;padding:22px 16px 50px}.top{background:linear-gradient(135deg,var(--green),#7d944e);color:white;border-radius:22px;padding:25px;box-shadow:0 8px 22px #0002}
h1{margin:0;font-size:32px}.tag{margin:6px 0 0;opacity:.95}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.pill{background:#fff2;border:1px solid #ffffff55;padding:8px 13px;border-radius:30px;font-weight:bold}
.progress{height:12px;background:#ffffff35;border-radius:20px;margin-top:18px;overflow:hidden}.bar{height:100%;background:var(--gold);width:0%;transition:.35s}
.card{background:white;border-radius:22px;margin-top:18px;padding:28px;box-shadow:0 6px 22px #00000012}.round{color:var(--green);font-weight:bold}
.q{font-size:23px;font-weight:700;margin:10px 0 22px}.option{width:100%;text-align:left;border:2px solid #dce2d2;background:#fff;border-radius:14px;padding:15px 16px;margin:8px 0;font-size:16px;cursor:pointer;transition:.15s}
.option:hover{transform:translateY(-1px);border-color:var(--green);background:#f7f9f2}.option:disabled{cursor:default;transform:none}.correct{border-color:var(--good)!important;background:#eaf6ed!important}.wrong{border-color:var(--red)!important;background:#fdecec!important}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#f3f5ed}.feedback strong{font-size:18px}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--green);color:white;font-weight:bold;cursor:pointer}.btn.alt{background:#858c78}
.start{text-align:center}.start .emoji{font-size:64px}.big{font-size:25px}.score{text-align:center}.scoreNum{font-size:65px;color:var(--green);font-weight:800}.badge{font-size:55px}.review{text-align:left;margin-top:22px}.review div{padding:11px 0;border-bottom:1px solid #ddd}
.hidden{display:none}@media(max-width:600px){h1{font-size:27px}.q{font-size:20px}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>💰 Money Master Challenge</h1>
<p class="tag">Can you beat the challenge?</p>
<div class="stats"><span class="pill">⭐ Score: <span id="score">0</span></span><span class="pill">🔥 Streak: <span id="streak">0</span></span><span class="pill">🏆 Best: <span id="best">0</span></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>
<div class="card" id="game"></div>
</div>
<script>
const qs=[
["When deciding which of the two items to purchase, one should always:",["Choose the item that costs less.","Choose the item with the greatest benefits.","Choose an item after comparing the costs and benefits of both items.","Don’t know."],2,"The smartest choice compares both costs and benefits."],
["Pat and Chris have identical interest-bearing bank accounts that pay them $15 interest per year. Pat leaves the $15 in the account each year, while Chris takes the $15 home to a jar and never spends any of it. After five years, who has more money?",["Pat.","Chris.","They both have the same amount.","Don’t know."],0,"Pat earns interest on the interest left in the account. That is compound interest."],
["Which of the following is the primary function of insurance?",["Making risk disappear.","Pooling and sharing risk among the insured.","Making someone else pay for an accident or loss.","Don’t know."],1,"Insurance pools risk among many insured people."],
["Which of the following has historically had the highest rate of return over long periods of time?",["Bank savings accounts.","Bonds.","Stocks.","Don’t know."],2,"Stocks have historically produced the highest long-term average return, with greater risk."],
["Which of the following would be expected to hold its value best during a time of inflation?",["A certificate of deposit.","A corporate bond.","A house.","Don’t know."],2,"Real assets such as houses can generally hold value better during inflation."],
["What is a budget?",["A spending plan showing sources and uses of income.","A limit on spending that cannot be exceeded.","The amount of money that a credit card will let you charge without penalties.","Don’t know."],0,"A budget is a plan for your income and spending."],
["Which of the following would hurt your credit score?",["Closing a long-held credit card account.","Paying off student loan debt.","Getting married.","Don’t know."],0,"Closing a long-held account can reduce available credit and affect credit-history length."],
["Which of the following loans is most likely to be classified as “predatory”?",["A high interest rate on a store credit card.","A cash-back home loan with a higher interest rate taken out after a high-pressure sales pitch.","A variable interest rate home mortgage that could rise 5 percentage points with inflation.","Don’t know."],1,"High-pressure sales tactics combined with harmful loan terms are a classic warning sign."],
["Which of the following strategies has shown the highest return over a period of years?",["Moving frequently in and out of the stock market to avoid downturns and exploit upturns.","Avoiding stocks entirely by keeping money in federally insured bank accounts.","Buying and holding onto a varied set of stocks, ignoring short-run fluctuations.","Don’t know."],2,"Diversification plus a long-term buy-and-hold approach has generally beaten attempts to time the market."],
["According to car experts, which of the following ordinarily provides the best value in automobile ownership?",["Always buying a new car and driving it only a few years.","Buying a relatively new used car and driving it for a long time.","Buying the cheapest used car available.","Don’t know."],1,"A relatively new used car can avoid much of the steepest depreciation while still providing years of use."]
];
let i=-1,score=0,streak=0,answered=false,best=Number(localStorage.moneyBest||0);
document.getElementById("best").textContent=best;
function home(){document.getElementById("game").innerHTML=`<div class="start"><div class="emoji">🏦</div><h2 class="big">Welcome to the Money Master Challenge!</h2><p>Answer 10 questions, build your streak, and see if you can earn the title of <b>Money Master</b>.</p><p>✨ Correct answers earn <b>100 points</b>, plus a streak bonus!</p><button class="btn" onclick="start()">Start Challenge 🚀</button></div>`}
function start(){i=0;score=0;streak=0;render()}
function render(){answered=false;document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.getElementById("bar").style.width=(i/qs.length*100)+"%";let x=qs[i];document.getElementById("game").innerHTML=`<div class="round">QUESTION ${i+1} OF ${qs.length}</div><div class="q">${x[0]}</div><div>${x[1].map((o,n)=>`<button class="option" onclick="answer(${n})">${String.fromCharCode(65+n)}. ${o}</button>`).join("")}</div><div class="feedback" id="fb"></div><div class="controls"><button class="btn alt" onclick="home()">Quit</button></div>`}
function answer(n){if(answered)return;answered=true;let x=qs[i],buttons=[...document.querySelectorAll(".option")],fb=document.getElementById("fb");buttons.forEach(b=>b.disabled=true);buttons[x[2]].classList.add("correct");if(n===x[2]){streak++;let pts=100+Math.max(0,streak-1)*25;score+=pts;fb.innerHTML=`<strong>🎉 Correct! +${pts} points</strong><br>${x[3]}<br><br>${streak>=3?"🔥 You’re on fire! Keep that streak going!":""}`}else{streak=0;buttons[n].classList.add("wrong");fb.innerHTML=`<strong>💡 Not quite!</strong><br>The best answer is <b>${x[1][x[2]]}</b>.<br>${x[3]}`}fb.style.display="block";document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;let c=document.querySelector(".controls");c.innerHTML=`<button class="btn alt" onclick="home()">Quit</button><button class="btn" onclick="${i===qs.length-1?"finish()":"next()"}">${i===qs.length-1?"See My Results 🏆":"Next Question →"}</button>`}
function next(){i++;render()}
function finish(){if(score>best){best=score;localStorage.moneyBest=best}document.getElementById("bar").style.width="100%";let pct=Math.round(score/(qs.length*325)*100);let badge=score>=1000?"🏆":score>=750?"🥇":score>=500?"🥈":"🥉";let title=score>=1000?"MONEY MASTER!":score>=750?"Financial Superstar!":score>=500?"Money Smart!":"Keep Learning!";document.getElementById("game").innerHTML=`<div class="score"><div class="badge">${badge}</div><h2>${title}</h2><div class="scoreNum">${score}</div><p>points earned</p><p><b>${score>=1000?"Outstanding! You crushed the challenge.":score>=750?"Fantastic work! Your financial knowledge is strong.":score>=500?"Nice job! You’re building solid financial knowledge.":"Every question is a chance to learn something useful!"}</b></p><p>🏆 Best score: <b>${best}</b></p><div class="controls" style="justify-content:center"><button class="btn" onclick="start()">Play Again 🔄</button></div></div>`}
home();
</script>
</body></html>
