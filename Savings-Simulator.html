<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Account Simulator</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            padding: 20px;
            color: #1e293b;
            margin: 0;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 800px;
            margin: 0 auto;
        }

        h2 {
            margin-top: 0;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        .val {
            font-weight: bold;
            color: #2563eb;
        }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
            margin-top: 20px;
        }

        .legend-box {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .leg-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            display: inline-block;
        }

        .note {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #f1f5f9;
            font-size: 13px;
            line-height: 1.45;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>💰 Savings, Money Market &amp; CD Simulator</h2>

        <div class="grid">
            <div>
                <label for="deposit">
                    Initial Deposit:
                    <span class="val" id="depVal">$1,000</span>
                </label>
                <input
                    type="range"
                    id="deposit"
                    min="100"
                    max="10000"
                    step="100"
                    value="1000"
                >
            </div>

            <div>
                <label for="years">
                    Timeline:
                    <span class="val" id="yearsVal">5 Years</span>
                </label>
                <input
                    type="range"
                    id="years"
                    min="1"
                    max="10"
                    step="1"
                    value="5"
                >
            </div>
        </div>

        <div class="chart-container">
            <canvas id="savingsChart" aria-label="Savings growth comparison chart" role="img"></canvas>
        </div>

        <div class="legend-box">
            <div class="leg-item">
                <span class="dot" style="background:#ef4444;"></span>
                Traditional Savings (0.5% APY)
            </div>

            <div class="leg-item">
                <span class="dot" style="background:#3b82f6;"></span>
                Money Market (3.5% APY)
            </div>

            <div class="leg-item">
                <span class="dot" style="background:#10b981;"></span>
                Certificate of Deposit (4.5% APY)
            </div>
        </div>

        <div class="note">
            Rates in this simulator are examples for comparison and may not match current bank rates.
        </div>
    </div>

    <script>
        const ctx = document.getElementById('savingsChart').getContext('2d');
        let chart;

        function calculateCompoundInterest(principal, rate, years) {
            const data = [];

            for (let year = 0; year <= years; year++) {
                data.push(Math.round(principal * Math.pow(1 + rate, year)));
            }

            return data;
        }

        function updateChart() {
            const principal = parseFloat(document.getElementById('deposit').value);
            const years = parseInt(document.getElementById('years').value, 10);

            document.getElementById('depVal').textContent =
                '$' + principal.toLocaleString();

            document.getElementById('yearsVal').textContent =
                years + (years === 1 ? ' Year' : ' Years');

            const labels = Array.from(
                { length: years + 1 },
                (_, i) => 'Year ' + i
            );

            const traditionalData =
                calculateCompoundInterest(principal, 0.005, years);

            const moneyMarketData =
                calculateCompoundInterest(principal, 0.035, years);

            const cdData =
                calculateCompoundInterest(principal, 0.045, years);

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Traditional Savings',
                            data: traditionalData,
                            borderColor: '#ef4444',
                            backgroundColor: 'transparent',
                            tension: 0.1,
                            borderWidth: 3
                        },
                        {
                            label: 'Money Market',
                            data: moneyMarketData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'transparent',
                            tension: 0.1,
                            borderWidth: 3
                        },
                        {
                            label: 'CD',
                            data: cdData,
                            borderColor: '#10b981',
                            backgroundColor: 'transparent',
                            tension: 0.1,
                            borderWidth: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': $' +
                                        context.parsed.y.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        document
            .getElementById('deposit')
            .addEventListener('input', updateChart);

        document
            .getElementById('years')
            .addEventListener('input', updateChart);

        updateChart();
    </script>
</body>
</html>
